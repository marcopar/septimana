name: Release

on:
  push:
    tags:
      - "v*.*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip; python -m pip install -e ".[dev]"

      - name: Verify tag matches source version
        shell: pwsh
        run: |
          $version = (python -c "from septimana import __version__; print(__version__)").Trim()
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match source version v$version."
          }

      - name: Test and package
        shell: pwsh
        run: |
          python -m pytest -q
          .\release.ps1

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/septimana-*-windows.zip
